<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">

      <div class="caja">
        <h2 class="title text-center mb-4">Iniciar sesión</h2>

        @if (error()) {
          <div class="alert alert-danger">{{ error() }}</div>
        }

        <form (ngSubmit)="entrar(cajaEmail.value, cajaContra.value)">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" #cajaEmail required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" #cajaContra required>
          </div>

          <button type="submit" class="btn btn-login w-100">Entrar</button>
        </form>
      </div>

    </div>
  </div>
</div>
