<div class="container my-5">

  <h2 class="title mb-4">Turnos</h2>

  <table class="table align-middle">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Hora</th>
        <th>Cliente</th>
        <th>Teléfono</th>
        <th>Profesional</th>
        <th>Tratamiento</th>
        <th>Estado</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (t of turnos(); track t.idTurno) {
        <tr>
          <td>{{ t.fecha | date:'dd/MM/yyyy' }}</td>
          <td>{{ t.hora }}</td>
          <td>{{ t.cliente }}</td>
          <td>{{ t.telefono }}</td>
          <td>{{ t.profesional }}</td>
          <td>{{ t.tratamiento }}</td>
          <td>
            <select class="form-select form-select-sm" #cajaEstado
                    (change)="cambiarEstado(t.idTurno, cajaEstado.value)">
              <option value="Pendiente" [selected]="t.estado === 'Pendiente'">Pendiente</option>
              <option value="Confirmado" [selected]="t.estado === 'Confirmado'">Confirmado</option>
              <option value="Cancelado" [selected]="t.estado === 'Cancelado'">Cancelado</option>
            </select>
          </td>
          <td class="text-end">
            <button class="accion borrar" (click)="borrar(t.idTurno)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
