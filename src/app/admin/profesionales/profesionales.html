<div class="container my-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="title">Profesionales</h2>
    <a class="btn btn-login" routerLink="/admin/profesionales/nuevo">
      <i class="bi bi-plus-lg"></i> Nuevo
    </a>
  </div>

  <table class="table align-middle">
    <thead>
      <tr>
        <th></th>
        <th>Nombre</th>
        <th>Especialidad</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (p of profesionales(); track p.idProfesional) {
        <tr>
          <td><img [src]="p.imagen || '/img/sin-foto.png'" class="foto"></td>
          <td>{{ p.nombre }} {{ p.apellido }}</td>
          <td>{{ p.especialidad }}</td>
          <td class="text-end">
            <a class="accion" [routerLink]="['/admin/profesionales/editar', p.idProfesional]">
              <i class="bi bi-pencil"></i>
            </a>
            <button class="accion borrar" (click)="borrar(p.idProfesional)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
