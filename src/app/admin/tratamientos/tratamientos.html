<div class="container my-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="title">Tratamientos</h2>
    <a class="btn btn-login" routerLink="/admin/tratamientos/nuevo">
      <i class="bi bi-plus-lg"></i> Nuevo
    </a>
  </div>

  <table class="table align-middle">
    <thead>
      <tr>
        <th></th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Duración</th>
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (t of tratamientos(); track t.idTratamiento) {
        <tr>
          <td><img [src]="t.imagen || '/img/sin-foto.png'" class="foto"></td>
          <td>{{ t.nombre }}</td>
          <td>{{ t.descripcion }}</td>
          <td>{{ t.precio | currency }}</td>
          <td>{{ t.duracion }} minutos</td>
          <td class="text-end">
            <a class="accion" [routerLink]="['/admin/tratamientos/editar', t.idTratamiento]">
              <i class="bi bi-pencil"></i>
            </a>
            <button class="accion borrar" (click)="borrar(t.idTratamiento)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>

</div>
