<div class="container my-5">

  <div class="text-end mb-3">
    <button class="btn btn-sm btn-outline-secondary" (click)="salir()">
      <i class="bi bi-box-arrow-right"></i> Cerrar sesión
    </button>
  </div>

  <h2 class="title text-center mb-2">Panel de administración</h2>
  <p class="text-center text-muted mb-5">Gestioná el contenido de Lumina Studio</p>

  <div class="row justify-content-center">

    <div class="col-12 col-md-6 col-lg-4 mb-4">
      <a class="tarjeta" routerLink="/admin/profesionales">
        <h5>Profesionales</h5>
        <p>Dar de alta, modificar o eliminar profesionales del equipo.</p>
      </a>
    </div>

    <div class="col-12 col-md-6 col-lg-4 mb-4">
      <a class="tarjeta" routerLink="/admin/tratamientos">
        <h5>Tratamientos</h5>
        <p>Administrar los tratamientos y sus especialidades.</p>
      </a>
    </div>

    <div class="col-12 col-md-6 col-lg-4 mb-4">
      <a class="tarjeta" routerLink="/admin/turnos">
        <h5>Turnos</h5>
        <p>Ver y gestionar los turnos reservados.</p>
      </a>
    </div>

  </div>
</div>
