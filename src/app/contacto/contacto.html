<div class="container my-5">
  <h2 class="title text-center mb-4">Contacto</h2>

  <div class="row">

    <div class="col-12 col-lg-5 mb-4">
      <div class="datos">
        <h5>Dónde estamos</h5>
        <p>Av. Giuseppe Garibaldi 1840<br>Rosario, Santa Fe</p>

        <h5>Horarios</h5>
        <p>Lunes a viernes de 9 a 19<br>Sábados de 9 a 13</p>

        <h5>Escribinos</h5>
        <p>
          <a href="mailto:hola@luminastudio.com">hola@luminastudio.com</a><br>
          <a href="tel:+543411234567">341 123-4567</a>
        </p>
      </div>
    </div>

    <div class="col-12 col-lg-7">
      @if (enviado()) {
        <div class="alert alert-success">
          ¡Gracias por escribirnos! Te vamos a responder a la brevedad.
        </div>
      } @else {
        <form (ngSubmit)="enviar()">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" name="nombre" [(ngModel)]="nombre" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="5" name="mensaje" [(ngModel)]="mensaje" required></textarea>
          </div>

          <button type="submit" class="btn btn-login">Enviar</button>
        </form>
      }
    </div>

  </div>
</div>
